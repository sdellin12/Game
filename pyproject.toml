[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible-balance-lab"
version = "0.1.0"
description = "Local combat experiments and practice rules harness for The Crucible"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crucible-sim = "crucible_sim.cli:main"

[project.gui-scripts]
crucible-lab = "crucible_lab.desktop:main"
crucible-play = "crucible_play.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crucible_content = ["*.json"]
